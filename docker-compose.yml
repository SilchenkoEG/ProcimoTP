name: courtly

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: courtly
      POSTGRES_PASSWORD: courtly
      POSTGRES_DB: courtly
    ports:
      # 5433 on the host so it doesn't clash with a locally installed Postgres on 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtly -d courtly"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://courtly:courtly@db:5432/courtly
      # Demo value so `docker compose up` needs no setup. Set a real secret in any real deployment.
      JWT_SECRET: courtly-demo-secret-change-me
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy
    # Not published on the host: the browser reaches it through the web container's /api proxy.
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
