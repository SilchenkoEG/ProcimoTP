server {
  listen 80;
  root /usr/share/nginx/html;

  # One origin for the browser: API calls go through here, so no CORS is needed.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Hashed build assets never change → cache them for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routing: unknown paths (/courts, /admin/bookings, …) serve the SPA.
  location / {
    try_files $uri /index.html;
  }
}
